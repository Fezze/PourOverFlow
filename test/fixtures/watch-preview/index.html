<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PourOverFlow Watch Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #d9d2c3;
        --watch-bezel: #14181e;
        --watch-text: #f5f7fa;
        --watch-accent: #2d8c82;
        --shadow: 0 32px 70px rgba(20, 24, 30, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.6), transparent 35%),
          linear-gradient(180deg, #ece5d7 0%, var(--page-bg) 100%);
        font-family: "Roboto", "Noto Sans", sans-serif;
        color: #1a1f27;
      }

      main {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      #status {
        min-height: 24px;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #watch-shell {
        position: relative;
        --bezel-padding: 14px;
        width: calc(var(--shell-width, 480px) + var(--bezel-padding) * 2);
        height: calc(var(--shell-height, 480px) + var(--bezel-padding) * 2);
        padding: var(--bezel-padding);
        border-radius: 50%;
        background: radial-gradient(circle at 30% 20%, #2c3440, var(--watch-bezel) 70%);
        box-shadow: var(--shadow);
      }

      #watch-shell[data-shape="square"] {
        --bezel-padding: 12px;
        border-radius: 56px;
        background: linear-gradient(180deg, #2b3340 0%, var(--watch-bezel) 100%);
      }

      #watch-face {
        position: relative;
        width: var(--shell-width, 480px);
        height: var(--shell-height, 480px);
        overflow: hidden;
        border-radius: 50%;
        background: #000;
      }

      #watch-shell[data-shape="square"] #watch-face {
        border-radius: 0;
      }

      body[data-framed="false"] {
        background: #000;
      }

      body[data-framed="false"] #status {
        display: none;
      }

      body[data-framed="false"] #watch-shell {
        --bezel-padding: 0px;
        background: none;
        box-shadow: none;
      }

      .widget, .scroll-card {
        position: absolute;
      }

      .text {
        display: flex;
        line-height: 1.18;
        overflow: hidden;
      }

      .text > span {
        width: 100%;
        overflow: hidden;
      }

      .button {
        display: grid;
        place-items: center;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
      }

      .image {
        object-fit: contain;
      }

      .scroll-list {
        overflow: auto;
        scrollbar-width: none;
      }

      .scroll-card {
        left: 0;
        right: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="status">booting</div>
      <div id="watch-shell">
        <div id="watch-face"></div>
      </div>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
